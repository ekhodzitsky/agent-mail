name: CI
on:
  # Disabled remotely; manual execution requires a new owner instruction.
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, '1.88.0']
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy --component rustfmt
      - name: Format
        if: matrix.toolchain == 'stable'
        run: cargo +stable fmt --check
      - name: Clippy (production)
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets -- -D warnings
      - name: Clippy (local SMTP tests)
        run: cargo +${{ matrix.toolchain }} clippy --locked --all-targets --features test-smtp -- -D warnings
      - name: Tests (production)
        run: cargo +${{ matrix.toolchain }} test --locked
      - name: Tests (loopback SMTP only)
        run: cargo +${{ matrix.toolchain }} test --locked --features test-smtp
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependency checkers
        run: |
          rustup toolchain install stable --profile minimal
          cargo +stable install cargo-audit --version 0.22.2 --locked
          cargo +stable install cargo-deny --version 0.20.2 --locked
      - name: Audit lockfile
        run: cargo audit
      - name: Check advisories, licenses and sources (including tests)
        run: cargo deny --locked --all-features check advisories licenses sources
